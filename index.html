const DATA={"people":[{"tag":"A","name":"윤서현","age":32,"job":"영화 감독","secret":"당신은 제작대표의 승인을 받지 않은 홍보 이미지를 외부에 전달했다. 도경이 이를 알게 되면 영화 공개 일정이나 감독 계약에 문제가 생길 수 있다. 20:29쯤 도경과 로비에서 큰소리로 다퉜고, 그 모습은 다른 스태프에게 보였을 가능성이 높다. 20:33~20:39에는 상영관 입구와 객석 사이에서 혼자 홍보물을 점검했다. 누구도 당신의 위치를 계속 확인하지는 않았다. 20:42의 목소리는 스피커에서 들었을 뿐, 도경을 직접 본 것은 아니다.","public":"단편영화 「잔상」의 감독. 이번 상영회에서 영화의 첫 공개와 기자 시사회를 진행한다. 작품의 제목과 엔딩 장면보다 자신의 이름이 크레딧에 어떻게 표시되는지를 더 민감하게 생각한다.","background":"단편영화 「잔상」의 감독. 이번 상영회에서 영화의 첫 공개와 기자 시사회를 진행한다. 작품의 제목과 엔딩 장면보다 자신의 이름이 크레딧에 어떻게 표시되는지를 더 민감하게 생각한다.","private":"당신은 제작대표의 승인을 받지 않은 홍보 이미지를 외부에 전달했다. 도경이 이를 알게 되면 영화 공개 일정이나 감독 계약에 문제가 생길 수 있다. 20:29쯤 도경과 로비에서 큰소리로 다퉜고, 그 모습은 다른 스태프에게 보였을 가능성이 높다. 20:33~20:39에는 상영관 입구와 객석 사이에서 혼자 홍보물을 점검했다. 누구도 당신의 위치를 계속 확인하지는 않았다. 20:42의 목소리는 스피커에서 들었을 뿐, 도경을 직접 본 것은 아니다.","alibi":"20:22~20:29 | 1층 로비에서 도경과 크레딧 표기 문제로 언쟁 | 도경에게 불만이 있었음을 인정\n20:29~20:33 | 1층 상영관 입구 포스터 점검 | 관리인에게 인쇄물을 부탁함\n20:33~20:39 | 상영관 안에서 혼자 좌석·현수막 확인 | 확실한 목격자는 없음\n20:40~20:44 | 상영관 안에서 안내 방송을 들음 | 목소리만 들음. 피해자를 직접 보지 않음\n20:44~20:50 | 1층 로비에서 인원 배치표 확인 | 20:46경 시우가 계단 쪽에서 로비로 나오는 모습 목격","items":["수정된 감독 크레딧 포스터 이미지","SNS 대행사에 보낸 11월 14일 오전 메시지","빨간색 펜과 현장용 대본","20:46경 계단 앞에서 권시우를 본 기억"],"qa":[["도경과 왜 싸웠나요?","감독 크레딧을 제작사보다 뒤에 배치했기 때문이에요. 제 동의를 받아야 할 내용이었습니다."],["20:36에는 어디 있었나요?","상영관에서 현수막과 좌석을 확인했습니다. 혼자라 계속 봤다는 증인은 없어요."],["20:42에 도경을 보았나요?","아뇨. 목소리는 들었지만 얼굴을 본 건 아닙니다."],["20:46에 무엇을 보았나요?","시우 씨가 계단 방향에서 로비 쪽으로 나오는 모습을 봤어요. 어느 층에서 왔는지는 못 봤습니다."],["홍보이미지를 무단으로 수정했나요?","감독 크레딧만 원래 논의했던 수준으로 되돌렸습니다. 승인 전에 보낸 건 맞아요."]],"objectives":["진범을 정확히 지목한다.","무단 홍보 이미지 공개를 감점 없이 정리한다.","자신이 20:42에 피해자를 직접 보지는 않았다는 점을 명확히 진술한다."],"id":1,"index":0,"roleKey":"A","roleMark":"ordinary","team":"비공개","oneLine":"단편영화 「잔상」의 감독. 이번 상영회에서 영화의 첫 공개와 기자 시사회를 진행한다. 작품의 제목과 엔딩 장면보다 자신의 이름이 크레딧에 어떻게 표시되는지를 더 민감하게 생각한다.","declaration":"당신은 영화 감독 윤서현입니다.","prologue":"서현은 지난 세 달 동안 작은 제작팀을 이끌며 단편영화 「잔상」의 촬영과 후반 작업을 마쳤다. 영화 제작비는 부족했고, 제작대표 최도경이 마지막에 배급사를 구해주지 않았다면 상영회를 취소할 수도 있었다. 서현은 그 도움을 인정하면서도 도경이 자신을 충분히 존중하지 않는다고 느낀다.\n\n시사회 일주일 전, 도경은 배급 제안서에서 서현의 이름보다 제작사의 브랜드를 앞세웠다. 서현은 감독 이름과 크레딧 표기를 원안대로 복구해달라고 요구했다. 도경은 행사 당일까지 최종 승인을 미뤘다. 11월 14일 오전, 서현은 자신이 수정한 홍보 이미지를 승인 없이 SNS 대행사에 전달했다.\n\n저녁 리허설이 시작되기 전 서현은 도경에게 자신이 요청한 크레딧을 반영해달라고 다시 말했다. 도경은 회계 문제를 먼저 처리해야 한다며 대화를 끝냈다. 서현은 화가 났다. 하지만 그의 죽음까지 바랐던 것은 아니다.","motive":"서현은 지난 세 달 동안 작은 제작팀을 이끌며 단편영화 「잔상」의 촬영과 후반 작업을 마쳤다. 영화 제작비는 부족했고, 제작대표 최도경이 마지막에 배급사를 구해주지 않았다면 상영회를 취소할 수도 있었다. 서현은 그 도움을 인정하면서도 도경이 자신을 충분히 존중하지 않는다고 느낀다.\n\n시사회 일주일 전, 도경은 배급 제안서에서 서현의 이름보다 제작사의 브랜드를 앞세웠다. 서현은 감독 이름과 크레딧 표기를 원안대로 복구해달라고 요구했다. 도경은 행사 당일까지 최종 승인을 미뤘다. 11월 14일 오전, 서현은 자신이 수정한 홍보 이미지를 승인 없이 SNS 대행사에 전달했다.\n\n저녁 리허설이 시작되기 전 서현은 도경에게 자신이 요청한 크레딧을 반영해달라고 다시 말했다. 도경은 회계 문제를 먼저 처리해야 한다며 대화를 끝냈다. 서현은 화가 났다. 하지만 그의 죽음까지 바랐던 것은 아니다.","privateKnowledge":"당신은 제작대표의 승인을 받지 않은 홍보 이미지를 외부에 전달했다. 도경이 이를 알게 되면 영화 공개 일정이나 감독 계약에 문제가 생길 수 있다. 20:29쯤 도경과 로비에서 큰소리로 다퉜고, 그 모습은 다른 스태프에게 보였을 가능성이 높다. 20:33~20:39에는 상영관 입구와 객석 사이에서 혼자 홍보물을 점검했다. 누구도 당신의 위치를 계속 확인하지는 않았다. 20:42의 목소리는 스피커에서 들었을 뿐, 도경을 직접 본 것은 아니다.","links":"단편영화 「잔상」의 감독. 이번 상영회에서 영화의 첫 공개와 기자 시사회를 진행한다. 작품의 제목과 엔딩 장면보다 자신의 이름이 크레딧에 어떻게 표시되는지를 더 민감하게 생각한다.","purpose":"자신이 20:42에 피해자를 직접 보지는 않았다는 점을 명확히 진술한다.","daySchedule":[{"time":"20:22~20:29","place":"1층 로비","detail":"1층 로비에서 도경과 크레딧 표기 문제로 언쟁","corroboration":"도경에게 불만이 있었음을 인정","visibility":"알려져도 됨"},{"time":"20:29~20:33","place":"1층 상영관 입구 포스터 점검","detail":"1층 상영관 입구 포스터 점검","corroboration":"관리인에게 인쇄물을 부탁함","visibility":"알려져도 됨"},{"time":"20:33~20:39","place":"상영관 안","detail":"상영관 안에서 혼자 좌석·현수막 확인","corroboration":"확실한 목격자는 없음","visibility":"알려져도 됨"},{"time":"20:40~20:44","place":"상영관 안","detail":"상영관 안에서 안내 방송을 들음","corroboration":"목소리만 들음. 피해자를 직접 보지 않음","visibility":"알려져도 됨"},{"time":"20:44~20:50","place":"1층 로비","detail":"1층 로비에서 인원 배치표 확인","corroboration":"20:46경 시우가 계단 쪽에서 로비로 나오는 모습 목격","visibility":"알려져도 됨"}],"personalItems":[["수정된 감독 크레딧 포스터 이미지","수정된 감독 크레딧 포스터 이미지"],["SNS 대행사에 보낸 11월 14일 오전 메시지","SNS 대행사에 보낸 11월 14 42 방송이 재생됨\n20:43~20:47 | 2층 복도에서 예비 릴 케이스 확인 | 기록보관실 쪽의 시우를 목격\n20:47~20:52 | 영사실로 돌아가 전송 상태 점검 | 일부 구간 단독","items":["20:42에 재생된 안내 멘트 파일 이름이 적힌 메모","승인받지 않은 음향 플러그인 설치 화면","영사실 출입카드","20:43경 기록보관실 근처에서 권시우를 봤다는 기억"],"qa":[["20:42 방송은 도경이 직접 말한 건가요?","도경 씨 목소리가 맞지만 실제로는 미리 녹음한 안내멘트예요. 필요하면 파일 생성시각을 확인해 보세요."],["왜 바로 녹음 사실을 말하지 않았나요?","승인받지 않은 플러그인을 함께 쓴 일이 걱정됐습니다. 그래도 숨기면 안 되는 사실이죠."],["20:36에는 어디에 있었나요?","영사실이었습니다. 20:34, 20:37, 20:40에 직접 장비를 조작한 기록이 남아 있어요."],["20:43에 시우를 보았나요?","기록보관실 쪽 복도에서 봤어요. 서류 같은 걸 들고 있었는데 정확한 색은 자신 없습니다."],["도경과 갈등이 있었나요?","장비 품질 문제로 지적을 받은 건 사실이지만 심각한 다툼은 없었습니다."]],"objectives":["진범을 정확히 지목한다.","20:42 방송이 생방송이 아님을 증명한다.","미승인 플러그인 사용은 가능한 한 합리적으로 해명한다."],"id":2,"index":1,"roleKey":"B","roleMark":"ordinary","team":"비공개","oneLine":"은하극장 시사회 영상과 스피커 운영을 책임지는 계약 영사기사. 정확한 시각과 파일 이름을 기억하는 데 자신이 있다. 사건이 발생한 날에도 대부분의 시간을 2층 영사실에서 보냈다고 주장한다.","declaration":"당신은 영사·음향 기사 박재민입니다.","prologue":"재민은 프리랜서 기술자로 영화제와 독립영화 시사회 현장을 오가며 일한다. 은하극장은 오래된 장비를 계속 보수해 쓰는 장소라서 더 많은 점검이 필요했다. 행사 며칠 전부터 그는 프로젝터 색상과 스피커 음량을 맞추느라 밤늦게까지 일했다.\n\n행사 준비 중 도경은 재민에게 “내가 로비에서 인사할 시간을 놓칠 수 있으니 안내 멘트만 미리 녹음하자”고 부탁했다. 11월 14일 19:48, 재민은 도경의 목소리를 2층 영사실에서 녹음했다. 도경은 “잠시 후 상영을 시작합니다. 편하게 자리에 앉아주세요”라고 말했다. 재민은 파일을 20:42에 자동으로 재생하도록 설정했다.\n\n재민은 이 작업에 정식 계약 범위 밖의 소프트웨어 플러그인을 사용했다. 이후 문제가 생기면 자신이 책임져야 한다는 것을 알고 있으므로 안내 방송을 미리 제작한 경위를 먼저 말하기가 꺼려진다. 그러나 녹음 사실 자체는 명백한 진실이다.","motive":"재민은 프리랜서 기술자로 영화제와 독립영화 시사회 현장을 오가며 일한다. 은하극장은 오래된 장비를 계속 보수해 쓰는 장소라서 더 많은 점검이 필요했다. 행사 며칠 전부터 그는 프로젝터 색상과 스피커 음량을 맞추느라 밤늦게까지 일했다.\n\n행사 준비 중 도경은 재민에게 “내가 로비에서 인사할 시간을 놓칠 수 있으니 안내 멘트만 미리 녹음하자”고 부탁했다. 11월 14일 19:48, 재민은 도경의 목소리를 2층 영사실에서 녹음했다. 도경은 “잠시 후 상영을 시작합니다. 편하게 자리에 앉아주세요”라고 말했다. 재민은 파일을 20:42에 자동으로 재생하도록 설정했다.\n\n재민은 이 작업에 정식 계약 범위 밖의 소프트웨어 플러그인을 사용했다. 이후 문제가 생기면 자신이 책임져야 한다는 것을 알고 있으므로 안내 방송을 미리 제작한 경위를 먼저 말하기가 꺼려진다. 그러나 녹음 사실 자체는 명백한 진실이다.","privateKnowledge":"20:42 방송이 생방송이 아니라 19:48에 녹음된 파일이라는 사실을 알고 있다. 그 사실을 숨길 의무는 없지만, 공개하면 승인되지 않은 플러그인을 쓴 일도 드러날 수 있다. 20:34·20:37·20:40에는 2층 영사실에서 손으로 장비 조작 버 ce":["C04","C09","C12","C18"],"evidence":"C04 · C09 · C12 · C18","actingTip":"설정집의 사실·비밀·진술 규칙을 구분해 연기합니다.","weakPoint":"미승인 오디오 플러그인 사용","revelation":"미승인 오디오 플러그인 사용","quotes":[],"hints":{},"props":[],"portrait":"assets/characters/role_b.png"},{"tag":"C","name":"한지우","age":30,"job":"행사 운영 PD","secret":"실제보다 180만 원 높은 행사비 초안을 도경에게 제출했다. 이 사실이 알려지면 행사 운영을 맡지 못하게 될 수 있다. 지하 창고에 있던 시간은 스스로 적은 장비 반출대장으로만 대체로 확인된다. 20:48에 사무실 문을 두드렸을 때 인기척이 없었지만 바쁘다고 생각했다. 20:51에 문서윤 관리자와 함께 다시 찾아가 안에 쓰러진 도경을 발견했다. 당신은 범인이 아니다.","public":"은하극장 시사회의 인력·동선·홍보물을 총괄하는 운영 PD. 제작대표의 서명을 받아야 하는 문서가 많아 관리사무실에도 자주 드나들었다. 건물의 지하 창고와 사무실 구조를 가장 잘 안다.","background":"은하극장 시사회의 인력·동선·홍보물을 총괄하는 운영 PD. 제작대표의 서명을 받아야 하는 문서가 많아 관리사무실에도 자주 드나들었다. 건물의 지하 창고와 사무실 구조를 가장 잘 안다.","private":"실제보다 180만 원 높은 행사비 초안을 도경에게 제출했다. 이 사실이 알려지면 행사 운영을 맡지 못하게 될 수 있다. 지하 창고에 있던 시간은 스스로 적은 장비 반출대장으로만 대체로 확인된다. 20:48에 사무실 문을 두드렸을 때 인기척이 없었지만 바쁘다고 생각했다. 20:51에 문서윤 관리자와 함께 다시 찾아가 안에 쓰러진 도경을 발견했다. 당신은 범인이 아니다.","alibi":"20:22~20:30 | 1층 매표소에서 운영인력 명단 점검 | 관리인과 동선 점검\n20:30~20:40 | 지하 설비창고에서 배너·무전기 배터리 수령 | 본인이 적은 반출대장\n20:40~20:44 | 1층 로비 및 상영관 앞에서 관리인과 대화 | 문서윤이 일부 확인 가능\n20:44~20:48 | 입장 동선과 객석 확인 | 혼자 있었던 구간 포함\n20:48~20:49 | 관리사무실 문을 두드렸으나 응답 없음 | 첫 번째 접근\n20:51~20:54 | 관리인과 사무실에 들어가 도경 발견 | 최초 발견자 중 한 명","items":["운영비 정산 초안과 수정 전 영수증","지하 창고 출입용 열쇠","무전기 배터리 반출대장","20:48 사무실에서 대답을 듣지 못했다는 기억"],"qa":[["행사비는 왜 다르게 기록됐나요?","급하게 처리한 운영비가 있어서 일부를 먼저 기재했습니다. 정식 승인은 아직 받지 못했습니다."],["20:35에 누가 지하에 함께 있었나요?","혼자 물품을 정리했습니다. 장비 반출대장이 있지만 제 필체로 적은 것이라 완벽한 알리바이는 아닙니다."],["20:48 문이 잠겨 있었나요?","잠겼는지는 확인하지 않았어요. 두드렸는데 대답이 없어서 바로 돌아섰습니다."],["누가 시신을 발견했나요?","20:51쯤 제가 문서윤 관리자와 함께 들어갔을 때 처음 발견했습니다."],["20:42 목소리는 어디서 들었나요?","상영관 방향 스피커에서 들었습니다. 피해자를 직접 본 것은 아닙니다."]],"objectives":["진범을 정확히 지목한다.","시신 발견 시각을 정확히 설명한다.","과장된 운영비의 처리 경위를 정리한다."],"id":3,"index":2,"roleKey":"C","roleMark":"ordinary","team":"비공개","oneLine":"은하극장 시사회의 인력·동선·홍보물을 총괄하는 운영 PD. 제작대표의 서명을 받아야 하는 문서가 많아 관리사무실에도 자주 드나들었다. 건물의 지하 창고와 사무실 구조를 가장 잘 안다.","declaration":"당신은 행사 운영 PD 한지우입니다.","prologue":"지우는 행사 준비를 위해 불과 세 주 전 은하극장 운영팀에 합류했다. 그는 제작대표 도경과 함께 공간 대관료, 현수막 발주, 운영인력 계약을 정리했다. 시사회 성사가 자신의 향후 기획 일거리와 연결돼 있었다.\n\n준비 기간 중 지우는 예상보다 비용이 늘어나자 일부 홍보·인력비를 실제보다 180만 원 높게 기재했다. 임시 운영비를 메우고 나중에 정산하면 된다고 생각했지만, 명백히 허락받지 않은 처리였다. 도경은 행사 당일 오전 해당 비용에 관해 질문했다.\n\n20:30 무렵 지우는 지하 창고에서 예비 배너와 무전기 배터리를 가져오느라 바빴다. 20:40쯤 1층으로 돌아와 상영관 앞에서 관리인과 다음 순서를 확인했다. 20:48에는 도경에게 진행표에 서명을 받으려 사무실에 다가갔지만 안에서 아무런 대답이 없었다.","motive":"지우는 행사 준비를 위해 불과 세 주 전 은하극장 운영팀에 합류했다. 그는 제작대표 도경과 함께 공간 대관료, 현수막 발주, 운영인력 계약을 정리했다. 시사회 성사가 자신의 향후 기획 일거리와 연결돼 있었다.\n\n준비 기간 중 지우는 예상보다 비용이 늘어나자 일부 홍보·인력비를 실제보다 180만 원 높게 기재했다. 임시 운영비를 메우고 나중에 정산하면 된다고 생각했지만, 명백히 허락받지 않은 처리였다. 도경은 행사 당일 오전 해당 비용에 관해 질문했다.\n\n20:30 무렵 지우는 지하 창고에서 예비 배너와 무전기 배터리를 가져오느라 바빴다. 20:40쯤 1층으로 돌아와 상영관 앞에서 관리인과 다음 순서를 확인했다. 20:48에는 도경에게 진행표에 서명을 받으려 사무실에 다가갔지만 안에서 아무런 대답이 없었다.","privateKnowledge":"실제보다 180만 원 높은 행사비 초안을 도경에게 제출했다. 이 사실이 알려지면 행사 운영을 맡지 못하게 될 수 있다. 지하 창고에 있던 시간은 스스로 적은 장비 반출대장으로만 대체로 확인된다. 20:48에 사무실 문을 두드렸을 때 인기척이 없었지만 바쁘다고 생각했다. 20:51에 문서윤 관리자와 함께 다시 찾아가 안에 쓰러진 도경을 발견했다. 당신은 범인이 아니다.","links":"은하극장 시사회의 인력·동선·홍보물을 총괄하는 운영 PD. 제작대표의 서명을 받아야 하는 문서가 많아 관리사무실에도 자주 드나들었다. 건물의 지하 창고와 사무실 구조를 가장 잘 안다.","purpose":"과장된 운영비의 처리 경위를 정리한다.","daySchedule":[{"time":"20:22~20:30","place":"1층 매표소","detail":"1층 매표소에서 운영인력 명단 점검","corroboration":"관리인과 동선 점검","visibility":"알려져도 됨"},{"time":"20:30~20:40","place":"지하 설비창고","detail":"지하 설비창고에서 배너·무전기 배터리 수령","corroboration":"본인이 적은 반출대장","visibility":"알려져도 됨"},{"time":"20:40~20:44","place":"1층 로비 및 상영관 앞","detail":"1층 로비 및 상영관 앞에서 관리인과 대화","corroboration":"문서윤이 일부 확인 가능","visibility":"알려져도 됨"},{"time":"20:44~20:48","place":"입장 동선과 객석 확인","detail":"입장 동선과 객석 확인","corroboration":"혼자 있었던 구간 포함","visibility":"알려져도 됨"},{"time":"20:48~20:49","place":"관리사무실 문을 두드렸으나 응답 없음","detail":"관리사무실 문을 두드렸으나 응답 없음","corroboration":"첫 번째 접근","visibility":"알려져도 됨"},{"time":"20:51~20:54","place":"관리인과 사무실에 들어가 도경 발견","detail":"관리인과 사무실에 들어가 도경 발견","corroboration":"최초 발견자 중 한 명","visi 일부 확인 가능\n20:32~20:44 | “로비에서 홍보자료 정리”라고 주장 | 거짓 진술\n20:34~20:39 | 실제로 관리사무실에서 도경과 대화 및 살해 | 범행 시간\n20:39~20:43 | 2층 기록보관실에 정산자료 은닉 | 재민이 20:43경 복도에서 목격\n20:43~20:46 | 2층 계단에서 1층 로비로 내려옴 | 서현이 20:46 로비에서 목격\n20:46~20:51 | 로비에서 상영 일정 문의 | 사건을 모르는 듯 행동","items":["권시우 명의 별도 사업자 거래내역 사본","홍보키트 2번 상자 인수증","정산 봉투와 같은 재질의 붉은 종이 부스러기가 묻은 서류 가방","제작대표와 20:34 만나기로 한 메시지"],"qa":[["도경과 20:34에 만나기로 했나요?","정산 이야기가 나온 건 맞지만, 그 시간에 실제로 사무실에 들어가지는 않았습니다. (거짓 진술)"],["그 시간에는 어디 있었나요?","로비에서 배급 관련 홍보물을 정리했습니다. 계속 혼자라 목격자는 없어요. (거짓 진술)"],["20:43에 왜 2층에서 목격됐나요?","홍보키트 내용물이 있는지 보러 잠깐 올라갔습니다. 누구나 갈 수 있는 곳입니다. (일부 사실)"],["홍보키트 안에 정산서가 왜 있나요?","누군가 제 물품에 넣었을 수 있습니다. 저는 그 자료를 보지 못했습니다. (거짓 진술)"],["다른 사업자 계좌로 돈을 받은 이유는?","정산을 빨리 하려고 임시로 사용했습니다. 횡령하려는 의도는 아니었습니다. (책임 회피 진술)"],["방송을 들었나요?","20:42에 도경 씨 목소리를 들었어요. 그때 살아 있었던 것으로 생각합니다. (녹음 여부는 모르면서 생존 근거로 사용)"]],"objectives":["범인으로 지목되지 않는다.","20:34 관리사무실 입실 및 2층 자료 은닉을 숨긴다.","배급 선급금 수령 사실을 가능한 한 축소한다."],"id":4,"index":3,"roleKey":"D","roleMark":"killer","team":"비공개","oneLine":"이번 영화의 배급·홍보계약을 담당한 실무 책임자. 제작대표 최도경과 가장 자주 돈과 일정 이야기를 나눴다. 행사 당일에도 배급사 담당자와 통화를 주고받느라 분주했다.","declaration":"당신은 배급·계약 총괄 권시우입니다.","prologue":"시우는 지난 세 달 동안 「잔상」의 배급 협상을 진행했다. 자금 사정이 나빠진 그는 제작사의 명의와 자신의 별도 사업자를 혼용해 선급금을 받을 수 있는 계약서를 만들었다. 배급사 측은 그가 제시한 서류를 진본으로 믿고 3,600만 원을 송금했다.\n\n시우는 우선 밀린 사업비를 메우고 며칠 후 제작사 계좌로 돌려놓을 생각이었다. 그러나 도경이 송금 내역을 확인하면서 계획이 무너졌다. 도경은 20:34에 관리사무실로 오라고 지시했다. “오늘 상영 전에 확실히 정리하자. 설명이 안 되면 바로 계약을 중지한다”고 했다.\n\n시우는 20:34 관리사무실에 들어갔다. 도경은 출력한 송금확인증과 붉은색 정산 봉투를 내밀며 서명이 위조됐다고 질책했다. 시우는 자료를 내놓으라고 요구했고 둘 사이에 몸싸움이 벌어졌다. 20:36 무렵 시우는 책상에 있던 무거운 황동 문진으로 도경의 머리를 가격했다. 도경이 쓰러진 뒤에는 구조 요청보다 자기에게 불리한 자료를 없애는 데 집중했다.\n\n20:39 시우는 정산 봉투와 출력물을 챙겨 2층 기록보관실로 올라갔다. 20:41 자신의 이름으로 반입된 홍보키트 2번 상자 안쪽에 자료를 숨겼다. 20:42 자동 안내 방송이 나오자 누군가는 도경이 아직 살아 있다고 생각할 것이라고 기대했다. 20:43 복도에서 영사기사 재민과 마주쳤으나 대수롭지 않게 넘어갔다. 20:46 로비로 돌아온 뒤 줄곧 1층에 있었던 것처럼 행동했다.","motive":"시우는 지난 세 달 동안 「잔상」의 배급 협상을 진행했다. 자금 사정이 나빠진 그는 제작사의 명의와 자신의 별도 사업자를 혼용해 선급금을 받을 수 있는 계약서를 만들었다. 배급사 측은 그가 제시한 서류를 진본으로 믿고 3,600만 원을 송금했다.\n\n시우는 우선 밀린 사업비를 메우고 며칠 후 제작사 계좌로 돌려놓을 생각이었다. 그러나 도경이 송금 내역을 확인하면서 계획이 무너졌다. 도경은 20:34에 관리사무실로 오라고 지시했다. “오늘 상영 전에 확실히 정리하자. 설명이 안 되면 바로 계약을 중지한다”고 했다.\n\n시우는 20:34 관리사무실에 들어갔다. 도경은 출력한 송금확인증과 붉은색 정산 봉투를 내밀며 서명이 위조됐다고 질책했다. 시우는 자료를 내놓으라고 요구했고 둘 사이에 몸싸움이 벌어졌다. 20:36 무렵 시우는 책상에 있던 무거운 황동 문진으로 도경의 머리를 가격했다. 도경이 쓰러진 뒤에는 구조 요청보다 자기에게 불리한 자료를 없애는 데 집중했다.\n\n20:39 시우는 정산 봉투와 출력물을 챙겨 2층 기록보관실로 올라갔다. 20:41 자신의 이름으로 반입된 홍보키트 2번 상자 안쪽에 자료를 숨겼다. 20:42 자동 안내 방송이 나오자 누군가는 도경이 아직 살아 있다고 생각할 것이라고 기대했다. 20:43 복도에서 영사기사 재민과 마주쳤으나 대수롭지 않게 넘어갔다. 20:46 로비로 돌아온 뒤 줄곧 1층에 있었던 것처럼 행동했다.","privateKnowledge":"당신이 최도경을 숨지게 한 유일한 범인이다. 공범은 없다. 살인은 미리 계획하지 않았다. 하지만 사건 직후 붉은 정산 봉투를 찢고, 안에 있던 지급 확인자료를 2층 홍보키트 2번 상자에 숨겼으며, 현장에 놓인 황동 문진을 물티슈로 닦은 것은 의도적인 증거 은폐다. 당신은 20:42 안내 방송이 녹음이었다는 사실을 확정적으로 알지는 못했지만, 당시 도경이 살아 있는 것처럼 상황을 설명하려 한다. 20:34~20:44에 로비에서 홍보물을 정리했다고 거짓말할 수 있다.","links":"이번 영화의 배급·홍보계약을 담당한 실무 책임자. 제작대표 최도경과 가장 자주 돈과 일정 이야기를 나눴다. 행사 당일에도 배급사 담당자와 통화를 주고받느라 분주했다.","purpose":"배급 선급금 수령 사실을 가능한 한 축소한다.","daySchedule":[{"time":"20:22~20:32","place":"1층 대기 구역","detail":"1층 대기 구역에서 배급사 연락","corroboration":"실제 일부 확인 가능","visibility":"알려져도 됨"},{"time":"20:32~20:44","place":"“로비","detail":"“로비에서 홍보자료 정리”라고 주장","corroboration":"거짓 진술","visibility":"비공개"},{"time":"20:34~20:39","place":"실제로 관리사무실","detail":"실제로 관리사무실에서 도경과 대화 및 살해","corroboration":"범행 시간","visibility":"비공개"},{"time":"20:39~20:43","place":"2층 기록보관실에 정산자료 은닉","detail":"2층 기록보관실에 정산자료 은닉","corroboration":"재민이 20:43경 복도에서 목격","visibility":"알려져도 됨"},{"time":"20:43~20:46","place":"2층 계단","detail":"2층 계단에서 1층 로비로 내려옴","corroboration":"서현이 20:46 로비에서 목격","visibility":"알려져도 됨"},{"time":"20:46~20:51","place":"로비","detail":"로비에서 상영 일정 문의","corroboration":"사건을 모르는 듯 행동","visibility":"알려져도 됨"}],"personalItems":[["권시우 명의 별도 사업자 거래내역 사본","권시우 명의 별도 사업자 거래내역 사본"],["홍보키트 2번 상자 인수증","홍보키트 2번 상자 인수증"],["정산 봉투와 같은 재질의 붉은 종이 부스러기가 묻은 서류 가방","정산 봉투와 같은 재질의 붉은 종이 부스러기가 묻은 서류 가방"],["제작대표와 20:34 만나기로 한 메시지","제작대표와 20:34 만나기로 한 메시지"]],"goals":[" 명","body":["권시우는 물적 정황과 진술이 겹치자 도경과 충돌했다는 사실을 시인한다. 그러나 봉투 속 계약금 문제가 공개적으로 이해되지 않은 채 남아 사건은 단순한 다툼처럼 소개된다.","누군가는 범인을 밝혔다는 결과에 안도하지만, 왜 그 밤에 폭력이 일어났는지는 이후 조사로 남는다."]},"C":{"title":"잘못된 시간","condition":"진범 외 다른 인물 지목","body":["참가자들은 20:42 안내 방송을 피해자가 살아 있었다는 결정적 증거로 믿거나, 각자가 감춘 작은 비밀에 시선을 빼앗긴다. 가장 그럴듯해 보이는 다른 사람을 지목하지만, 시우가 가져간 봉투의 행방은 설명되지 않는다.","관리인은 수집한 자료를 경찰에게 넘기며 “우리가 들은 것과 실제로 일어난 일은 다를 수 있습니다”라고 말한다."]},"D":{"title":"아무도 확신하지 못했다","condition":"결선 후 동수 또는 최종 지목 실패","body":["참가자들은 하나의 일관된 결론을 내리지 못한다. 그러나 영사실에 남은 재생 기록과 2층 상자 속 정산서는 그대로 남는다.","누군가는 마지막에 다시 질문한다. “20시 42분에 우리가 들은 목소리는, 정말 그때 말한 목소리였을까요?”"]}},"explain":["유일한 범인은 배급·계약 총괄 권시우다. 공범은 없다.","20:34 관리사무실에서 선급금 3,600만 원의 수령 경위를 추궁받던 시우는 20:36경 황동 문진으로 도경을 가격했다. 미리 계획한 살인은 아니었지만, 쓰러진 도경을 두고 문진을 닦고 자료를 숨긴 것은 의도적인 은폐다.","시우는 20:41 2층 홍보키트 2번 상자에 붉은 봉투와 서류를 숨겼다. 20:43 재민, 20:46 서현의 목격은 계속 로비에 있었다는 진술과 충돌한다.","20:42 안내 방송은 19:48에 녹음된 파일의 자동 재생이다. 목소리를 들었다는 사실은 그 시각의 생존을 뜻하지 않는다. 방송 기록, 봉투 이동, 금전 동기와 진술 모순을 함께 비교해야 한다."],"epilogues":{}},"maps":{"F1":{"name":"1층","rows":["########################################################################","########################################################################","########################################################################","######.........#########################################################","######.........#############################################.......#####","######.........#############################################.......#####","######..U......###########..............####################..U....#####","######.........###########..............####################.......#####","######.........###########..............####################.......#####","######.........###########..............####################.......#####","######.........###########..............####################.......#####","######.........DDDDDDDDDDDD............DDDDDDDDDDDDDDDDDDDDDD......#####","######.........DDDDDDDDDDDD............DDDDDDDDDDDDDDDD openBag=async function(c,sp){
  if(S.phase<2&&!window.TG_ADMIN)return say(['개인 소지품은 2차 증거 수집부터 확인할 수 있다.'],sp.name);
  const pi=Number(c.owner||0)-1,person=DATA.people[pi];
  if(!person||!roleActive(pi))return say(['이 보관대는 비어 있다.'],sp.name);
  S.got[c.id]={phase:S.phase,at:Date.now(),viewed:true};
  S.visited[c.spot]=S.phase;save();updateHud();
  const owner=liveName(pi),items=person.personalItems||[];
  if(!items.length)return say(['보관함에 확인할 만한 물건이 없다.'],sp.name);
  let first=true;
  while(true){
    const choice=await ask((pi===state.role?'내':owner+'의')+' 개인 소지품이다.'+(first?'\n물건을 그 자리에 둔 채 내용을 살펴본다.':''),[...items.map(it=>LT(it[0])),'열람 마치기'],sp.name);
    first=false;if(!Number.isInteger(choice)||choice<0||choice>=items.length)break;
    const item=items[choice];await say(pages(LT(item[1]||'')),LT(item[0]));
  }
};
const cinemaBagInspect=inspect;
inspect=async function(id){
  if(!window.TG_ADMIN){
    const bags=availableClues(id).filter(c=>c.kind==='bag');
    if(bags.length){for(const c of bags)await openBag(c,SPOT[id]);return;}
  }
  return cinemaBagInspect(id);
};

// Protected office interior opens in round2; the corridor memo remains available.
const walkBefore2042=walkable;
walkable=function(f,x,y){if(S.phase<2&&roomAt(f,x,y)?.phase===2)return false;return walkBefore2042(f,x,y);};
// The scene remains intact: only its first investigator receives the digital card.
inspect=async function(id){
 const sp=SPOT[id];if(!sp)return;
 const all=CLUES_AT[id]||[];
 if(window.TG_ADMIN){await say(['관리자 시찰: 자료를 수집하지 않습니다.',...all.map(c=>{const o=claimOwnerV11('E:'+c.id);return c.id+' '+c.title+' · '+(o?o.name+' 조사 완료':'미조사')+' · '+c.phase+'차';})],sp.name);return;}
 if(!isExploring())return say(['지금은 증거 수집 시간이 아닙니다.'],sp.name);
 const av=all.filter(c=>c.phase<=S.phase);
 if(!av.length)return say(['현장 보존을 위해 정밀 조사는 아직 할 수 없다. 2차 수색 때 다시 확인하자.'],sp.name);
 S.visited[id]=S.phase;save();
 for(const c of av){
   if(c.kind==='bag'){await openBag(c,sp);continue;}
   const owner=claimOwnerV11('E:'+c.id);
   if(owner&&owner.owner!==state.role){await say(['이미 조사가 끝난 물건이다. 현장 물건은 그대로 남아 있다.','기록한 증거카드의 공개 여부는 최초 수집자 '+owner.name+'와 토론하자.'],sp.name);continue;}
   if(S.got[c.id]){await openCard(c.id);continue;}
   if(S.limits[PK()]>0&&picksLeft()<=0){await say(['현재 조사권을 모두 사용했다.'],sp.name);continue;}
   if(!await doWorldClaimV11('E:'+c.id)){await say(['다른 참가자가 먼저 조사를 마쳤다.'],sp.name);continue;}
   if(S.limits[PK()]>0)S.used[PK()]=(S.used[PK()]||0)+1;
   await collect(c,sp);
 }
 updateHud();
};
const before2042Card=window.TG_openCard;
window.TG_openCard=function(id){const c=CLUES.find(x=>x.id===id);if(!c)return;if(c.kind!=='bag'&&!window.TG_ADMIN&&state.stage!=='finished'&&!state.inventory.includes(id)){alert('내가 기록한 증거카드만 열 수 있습니다.');return;}return before2042Card(id);};

})();

</script>

<script id="ls-lodge-app-structure">// Restore the lodge application's screen structure with Last Screening content.

 return ACTIVE_ROLE_INDICES.map(i=>{const c=cast[i],online=pres.some(x=>x&&Number(x.role)===i);return `<tr><td>${String(dispNo(i)).padStart(2,'0')}</td><td>${E(DATA.people[i].name)}</td><td>${E(c?.name||'미배정')}</td><td>${c?(SYNC.on?(online?'접속':'오프라인'):'이 기기 시연'):''}</td><td>${ballots[i]?'제출 완료':'—'}</td></tr>`;}).join('');

 const cast=currentCast(),pres=Object.values(SYNC.data.presence||{});
 return panel(`<h3>참가자 (${ACTIVE_ROLE_INDICES.filter(i=>cast[i]).length}/${PLAYER_COUNT})</h3><div class="v24-cast">${[...ACTIVE_ROLE_INDICES,DIRECTOR].map(i=>`<button type="button" class="v24-chip ${pres.some(p=>p&&Number(p.role)===i)?'on':''}" onclick="openPerson(${i})"><span>${String(dispNo(i)).padStart(2,'0')}</span><b>${E(DATA.people[i].name)}</b><small>${i===DIRECTOR?'관리자':E(cast[i]?.name||'미배정')}</small></button>`).join('')}</div>`);

 return panel(`<h3>사건 메모</h3><p class="muted" style="font-size:12px">토론 중 떠오른 가설, 시간표와 증거 관계를 자유롭게 정리하세요. 이 메모는 본인만 볼 수 있습니다.</p><textarea class="field case-memo" id="caseMemoText" placeholder="직접 본 사실, 전해 들은 진술, 확인할 시각을 구분해 기록하세요." oninput="LS_saveCaseMemo(this.value)">${E(state.notes||'')}</textarea><div style="text-align:right"><small class="muted" id="memoSaved">입력 시 자동 저장</small></div>`);
}

function directorHome(){
 const unread=personalMail().filter(m=>m.to===DIRECTOR&&!state.seenMailIds?.includes(m.id)).length;
 const index=STAGES.findIndex(s=>s[0]===state.stage),next=STAGES[index+1];
 return `<div class="sticky-status ls-director-status">🎬 <b>관리인 ${E(directorName())}</b> · 관리자<br><small>${statusText()} · 참가자 ${ACTIVE_ROLE_INDICES.filter(i=>currentCast()[i]).length}/${PLAYER_COUNT}명</small></div>`+
 panel(`${timer()}${adminAuthenticated?`<div class="row" style="justify-content:center;gap:6px">${ui('','−1분','adjustTimer(-1)','outline')}${ui('','+1분','adjustTimer(1)','outline')}${ui('','+5분','adjustTimer(5)','outline')}${next?ui('',`다음: ${E(next[1])} ▶`,'nextStage()','primary'):''}</div>`:`<p class="muted" style="text-align:center">진행 조작은 「관리자」 탭에서 비밀번호 확인 후 할 수 있습니다.</p>`}`)+
 (unread?panel(`<h3>새 메시지 ${unread}건</h3>${ui('','채팅 열기',"setview('chat')",'primary')}`):'')+
 panel(`<h3>오늘 진행자가 할 일</h3><ul class="ls-rules"><li><b>설정집 숙지·오프닝</b>: 참가자가 자기 설정집을 읽은 뒤 오프닝을 함께 확인합니다.</li><li><b>1·2차 수색</b>: 조사 단계와 타이머를 조정하고 필요하면 지도를 시찰합니다.</li><li><b>대면 토론</b>: 직접 본 사실과 진행자로서 아는 정답을 구분하고, 요청에 맞춰 단계별 힌트를 전합니다.</li><li><b>최종 투표</b>: 참가자 네 명이 한 명씩 지목합니다. 동률이면 결선을 한 번 진행합니다.</li><li><b>엔딩 공개</b>: 관리자에서 개인 목표와 정산자료 공개 여부를 확인한 뒤 개표합니다.</li></ul><div class="row">${ui('','관리자 패널 열기',"setview('admin')",'primary')}${ui('','오프닝 재생','openOpening()','outline')}${state.stage==='finished'?ui('','엔딩북 열기',"setview('book')",'outline'):''}</div>`)+castOverview()+memoPanel();

 panel(`${timer()}<div class="row between"><div><b>${statusText()}</b><br><small class="muted">진행자가 단계를 바꾸면 화면과 남은 시간이 함께 맞춰집니다.</small></div></div>${isExploring()?`<button type="button" class="btn primary ls-wide-action" onclick="setview('map')">극장 탐색하러 가기</button>`:''}${state.stage==='intro'?`<button type="button" class="btn primary ls-wide-action" onclick="openOpening()">오프닝 재생</button>`:''}${state.stage==='vote'?`<button type="button" class="btn primary ls-wide-action" onclick="setview('vote')">최종 투표 열기</button>`:''}${state.stage==='finished'?`<button type="button" class="btn primary ls-wide-action" onclick="setview('book')">엔딩과 전체 기록</button>`:''}`)+

 panel(`<div class="row between"><div><h2 style="margin:0">등장인물</h2><small class="muted">이름을 누르면 대화·알리바이 메모·투표 기능이 열립니다.</small></div></div><div class="cast-list ls-cast-list">${[...ACTIVE_ROLE_INDICES,DIRECTOR].map(i=>personSummary(i)).join('')}</div>`)+memoPanel()+`<p class="footer-note">현장 토론은 직접 진행합니다. 채팅에서는 1:1 연락과 진행자 문의를 보낼 수 있습니다. ${ui('','오프닝 다시 보기','openOpening()','outline')}</p>`;

 if(directorTab==='script')body=panel(`<h3>힌트 대본</h3>${Object.entries(p.hints||{}).map(([k,h],i)=>`<div class="entry"><span class="tag">${i+1}단계 힌트</span><div class="ls-script">“${E(h.script)}”</div></div>`).join('')}<h4>진술 원칙</h4><div class="ls-script">${E(p.guide?.rule)}</div><h4>진행 도구</h4><p>인터뷰 기록, 개인 힌트 전송과 전체 공지는 관리자 패널에서 사용합니다.</p>${ui('','관리자 패널 열기',"setview('admin')",'primary')}`);
 if(directorTab==='schedule')body=panel(`<h3>11월 14일 · 시간별 행적</h3><div class="timeline">${(p.daySchedule||[]).map(r=>`<div class="timeline-row"><div class="clock">${E(r.time)}</div><div class="time-detail"><b>${E(r.place)}</b><p>${E(r.detail)}</p><div class="witness">교차 확인: ${E(r.corroboration)}</div></div></div>`).join('')}</div>`);
 if(directorTab==='ending')body=`<div class="case-notice">진행자 전용: 결말과 진범이 모두 나옵니다. 참가자에게 화면이 보이지 않게 해 주세요.</div>`+allEndings();
 if(directorTab==='memo')body=memoPanel();
 return `<h2>진행자 설정집</h2><div class="card profile-cover"><small class="muted">DIRECTOR BOOK · ROLE ${String(PLAYER_COUNT+1).padStart(2,'0')}</small><h2>${E(p.declaration)}</h2><p class="muted">관리자 · 투표 제외 · 채팅·지도·공지 참여</p></div><div class="tabs">${tabs.map(([k,label])=>ui('',label,`LS_directorTab('${k}')`,directorTab===k?'primary':'outline')).join('')}</div>${body}`;
};

 const cast=currentCast(),regs=Object.entries(SYNC.data.regs||{}).sort((a,b)=>(a[1].at||0)-(b[1].at||0)),byDevice={};
 Object.entries(cast).forEach(([i,c])=>{if(c?.device)byDevice[c.device]=Number(i);});
 const waiting=regs.filter(([dev])=>byDevice[dev]==null),assigned=ACTIVE_ROLE_INDICES.filter(i=>cast[i]).length;
 let body=`<h3>참가자 등록 · 역할 일괄 배정</h3><p class="muted">참가자는 이름·성별을 등록하고 대기합니다. 참가자 네 명의 역할을 배정하며 관리인은 별도로 입장합니다.</p><p>참가자 등록 <b>${regs.length}</b>명 · 배정 대기 <b>${waiting.length}</b>명 · 배정 완료 <b>${assigned}/${PLAYER_COUNT}</b>명</p>`;
 if(SYNC.on){body+=ui('','등록자 역할 일괄 배정','adminAssignAll()','primary');if(regs.length)body+=`<div class="tg-x" style="margin-top:10px"><table class="tg-grid"><thead><tr><th>이름</th><th>성별</th><th>배역</th><th>관리</th></tr></thead><tbody>${regs.map(([dev,r])=>{const id=byDevice[dev];return `<tr><td>${E(r.name)}</td><td>${E(r.gender)}</td><td>${id!=null?E(DATA.people[id]?.name):'대기'}</td><td>${id!=null&&roleActive(id)?ui('','해제',`adminUnassign(${id})`,'outline'):id==null?ui('','삭제',`LS_removeRegistration(${JSON.stringify(dev).replace(/"/g,'&quot;')})`,'outline'):''}</td></tr>`;}).join('')}</tbody></table></div>`;}
 else body+=`<p class="muted">현재 기기 시연입니다. 참가자 배역을 골라 화면과 기능을 확인할 수 있습니다.</p><input class="field" id="previewName" value="테스트 참가자" aria-label="시연 참가자 이름"><select class="field" id="previewRole" aria-label="시연 배역">${activePeopleMap((p,i)=>`<option value="${i}">${E(p.name)} · ${E(p.job)}</option>`).join('')}</select>${ui('','선택 배역 시연',"assignSpecific(Number(el('previewRole').value))",'outline')}`;
 return panel(body);
}
window.LS_removeRegistration=async function(device){if(!adminAuthenticated||!SYNC.on||!confirm('이 대기 등록을 지울까요?'))return;await SYNC.db.remove(SYNC.R('regs/'+device));};
const inheritedAdminPage=adminPage;
adminPage=function(){
 if(!adminAuthenticated)return inheritedAdminPage();
 const rem=remaining(),votes=currentVoteState(),ballots=currentBallots();
 const stageRows=STAGES.filter(s=>s[0]!=='finished').map(([key,label,minutes])=>`<tr${state.stage===key?' class="ls-current-stage"':''}><td>${E(label)}</td><td>${minutes?minutes+'분':'—'}</td><td><button type="button" class="btn ${state.stage===key?'primary':'outline'}" onclick="startPhase('${key}')">${state.stage===key?'다시 시작':'시작'}</button></td></tr>`).join('');
 const stages=panel(`<h3>진행 단계와 타이머</h3><p class="muted">「시작」을 누르면 참가자들의 단계와 남은 시간이 함께 바뀝니다. 증거 수집 시간이 끝나면 조사가 잠깁니다.</p><div class="row ls-timer-actions">${ui('','다음 단계 ▶','nextStage()','primary')}${ui('','+1분','adjustTimer(1)','outline')}${ui('','+5분','adjustTimer(5)','outline')}${ui('','−1분','adjustTimer(-1)','outline')}${ui('','지금 종료','adjustTimer(0)','outline')}</div><div class="tg-x"><table class="tg-grid ls-stage-table"><thead><tr><th>진행 단계</th><th>기본 시간</th><th>시작</th></tr></thead><tbody>${stageRows}</tbody></table></div><p>${ui('','엔딩 · 점수 공개','finalize()','primary')}${ui('','오프닝 재생','openOpening()','outline')}</p>`);
 const inspect=panel(`<h3>관리자 지도 시찰</h3><p class="muted">관리인 ${E(directorName())}으로 극장을 자유롭게 이동하며 조사 지점의 획득 현황을 봅니다. 증거와 소지품은 가져가지 않습니다.</p>${ui('','관리자 지도 탐색','enterAdminMap()','primary')}`);
 const finalVote=panel(`<h3>최종 투표 현황</h3><p>${votes.round===1?'결선 1회':'첫 투표'} · <b>${Object.keys(ballots).length}/${PLAYER_COUNT}명</b> 제출</p><p class="muted">한 명만 지목합니다. 유일한 최다득표자를 지목하며 동률이면 결선 1회, 재동률이면 지목 실패입니다. 관리자는 투표하지 않습니다.</p>${ui('','개표 · 필요하면 결선 시작','finalize()','primary')}`);
 const roster=panel(`<h3>실시간 동기화 · ${SYNC.on?(SYNC.connected?'연결됨':'연결 중'):'현재 기기 시연'}</h3><div class="tg-x"><table class="tg-grid"><thead><tr><th>#</th><th>배역</th><th>참가자</th><th>상태</th><th>투표</th></tr></thead><tbody>${participantRows()}</tbody></table></div>`);
 const notices=panel(`<h3>전체 공지 · 단계별 힌트</h3><p class="muted">공지 내용을 확인한 뒤 보내세요. 개별 힌트는 인터뷰 기록에서 해당 참가자에게 전송할 수 있습니다.</p><textarea class="field" id="noticeText" rows="3" placeholder="전체 공지"></textarea><p>${ui('','공지 보내기','sendNotice()','primary')}${ui('','참가자 대화',"setview('chat')",'outline')}</p>${Object.entries(DATA.people[DIRECTOR].hints||{}).map(([k,h],i)=>`<details class="entry"><summary>${i+1}단계 힌트</summary><p>${E(h.script)}</p>${ui('','공지에 넣기',`fillNotice('${k}')`,'outline')}</details>`).join('')}`);
 const gm=panel(`<h3>진행자 전용 자료</h3><details><summary>사건의 전말 · 실제 시간표</summary>${allEndings()}</details><details class="entry"><summary>전체 증거 배치 · 해설</summary>${TG_DATA.clues.filter(c=>c.kind!=='bag').map(c=>`<div class="entry"><b>${E(c.id)} · ${E(c.title)}</b><p>${E(TG_DATA.spotNames[c.spot])} · ${c.phase}차</p><small>${E(c.gm)}</small></div>`).join('')}</details>`);
 const reset=panel(`<h3>초기화</h3><p class="muted">${SYNC.on?'이 작품의 참가자 배정·진행·증거·쪽지·투표를 초기화합니다.':'이 기기의 이 작품 시연 기록을 초기화합니다.'}</p><div class="row">${ui('','새 게임 시작','resetDemo()','outline')}${ui('','관리자 로그아웃','adminLogout()','outline')}</div>`);
 return `<h2>진행자 콘솔</h2><div class="sticky-status">현재 단계: <b>${E(phaseName())}</b> · 남은 시간 <b class="gold" id="admTimer">${rem==null?'시간 제한 없음':mmss(rem)}</b><br><small>${statusText()} · 참가자 ${PLAYER_COUNT}명 + 관리자 1명</small></div>${stages}${registrationPanel()}${inspect}${finalVote}${adjudicationPanel()}${panel('<h3>점수 현황'+(state.stage==='finished'?'':' <small class="muted">(미리보기)</small>')+'</h3>'+scoreTable())}${roster}${directorToolsPanel()}${notices}${gm}${reset}`;
};
// Chat follows the lodge tool's stream and fixed composer, using the existing DM handler.
chatPage=function(){
 if(!role())return startPage();
 if(activeConversation===-1)return `<h2>개인 채팅</h2><p class="muted">다른 참가자와 개인적으로 연락하고 진행자에게 문의할 수 있습니다. 현장 토론은 직접 진행합니다.</p>${[...ACTIVE_ROLE_INDICES,DIRECTOR].filter(i=>i!==state.role).map(i=>{const msgs=personalMail().filter(m=>m.from===i||m.to===i),last=msgs[msgs.length-1],unread=msgs.some(m=>m.to===state.role&&!state.seenMailIds?.includes(m.id));return `<button type="button" class="thread-card" onclick="openConversation(${i})"><span class="thread-avatar">${i===DIRECTOR?'🎬':E(DATA.people[i].name.slice(0,1))}</span><span class="thread-meta"><b>${E(liveName(i))}</b><small>${last?E(last.body):E(DATA.people[i].job)+' · 메시지를 보내 대화 시작'}</small></span>${unread?'<span class="unread-dot"></span>':''}</button>`;}).join('')}`;
 const peer=activeConversation,msgs=personalMail().filter(m=>m.from===peer||m.to===peer);
 return `<div class="chat-top"><button type="button" class="btn outline" onclick="activeConversation=-1;render()">← 대화 목록</button><div style="text-align:right"><b>${E(liveName(peer))}</b><br><small class="muted">${E(DATA.people[peer].job)}</small></div></div><div id="chatStream" class="chat-stream">${msgs.length?msgs.map(m=>`<div class="bubble ${m.from===state.role?'mine':''}"><small>${E(liveName(m.from))} · ${new Date(m.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</small>${E(m.body)}</div>`).join(''):'<div class="case-notice">아직 메시지가 없습니다. 직접 만나 말하기 어려운 내용을 전해 보세요.</div>'}</div><div class="chat-compose"><textarea id="chatText" class="field" rows="2" maxlength="1000" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();sendMessage()}"></textarea>${ui('','전송','sendMessage()','primary')}</div>${peer===DIRECTOR&&roleActive(state.role)?`<p>${ui('','내 증거 제시','showEvidenceToDirector()','outline')}</p>`:''}`;
};
const inheritedRender=render;
render=function(){document.body.classList.toggle('dir-nav',isDirector());return inheritedRender();};
})();
</script>
<script>boot2042();</script></body></html>
