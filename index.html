42 방송이 재생됨\n20:43~20:47 | 2층 복도에서 예비 릴 케이스 확인 | 기록보관실 쪽의 시우를 목격\n20:47~20:52 | 영사실로 돌아가 전송 상태 점검 | 일부 구간 단독","items":["20:42에 재생된 안내 멘트 파일 이름이 적힌 메모","승인받지 않은 음향 플러그인 설치 화면","영사실 출입카드","20:43경 기록보관실 근처에서 권시우를 봤다는 기억"],"qa":[["20:42 방송은 도경이 직접 말한 건가요?","도경 씨 목소리가 맞지만 실제로는 미리 녹음한 안내멘트예요. 필요하면 파일 생성시각을 확인해 보세요."],["왜 바로 녹음 사실을 말하지 않았나요?","승인받지 않은 플러그인을 함께 쓴 일이 걱정됐습니다. 그래도 숨기면 안 되는 사실이죠."],["20:36에는 어디에 있었나요?","영사실이었습니다. 20:34, 20:37, 20:40에 직접 장비를 조작한 기록이 남아 있어요."],["20:43에 시우를 보았나요?","기록보관실 쪽 복도에서 봤어요. 서류 같은 걸 들고 있었는데 정확한 색은 자신 없습니다."],["도경과 갈등이 있었나요?","장비 품질 문제로 지적을 받은 건 사실이지만 심각한 다툼은 없었습니다."]],"objectives":["진범을 정확히 지목한다.","20:42 방송이 생방송이 아님을 증명한다.","미승인 플러그인 사용은 가능한 한 합리적으로 해명한다."],"id":2,"index":1,"roleKey":"B","roleMark":"ordinary","team":"비공개","oneLine":"은하극장 시사회 영상과 스피커 운영을 책임지는 계약 영사기사. 정확한 시각과 파일 이름을 기억하는 데 자신이 있다. 사건이 발생한 날에도 대부분의 시간을 2층 영사실에서 보냈다고 주장한다.","declaration":"당신은 영사·음향 기사 박재민입니다.","prologue":"재민은 프리랜서 기술자로 영화제와 독립영화 시사회 현장을 오가며 일한다. 은하극장은 오래된 장비를 계속 보수해 쓰는 장소라서 더 많은 점검이 필요했다. 행사 며칠 전부터 그는 프로젝터 색상과 스피커 음량을 맞추느라 밤늦게까지 일했다.\n\n행사 준비 중 도경은 재민에게 “내가 로비에서 인사할 시간을 놓칠 수 있으니 안내 멘트만 미리 녹음하자”고 부탁했다. 11월 14일 19:48, 재민은 도경의 목소리를 2층 영사실에서 녹음했다. 도경은 “잠시 후 상영을 시작합니다. 편하게 자리에 앉아주세요”라고 말했다. 재민은 파일을 20:42에 자동으로 재생하도록 설정했다.\n\n재민은 이 작업에 정식 계약 범위 밖의 소프트웨어 플러그인을 사용했다. 이후 문제가 생기면 자신이 책임져야 한다는 것을 알고 있으므로 안내 방송을 미리 제작한 경위를 먼저 말하기가 꺼려진다. 그러나 녹음 사실 자체는 명백한 진실이다.","motive":"재민은 프리랜서 기술자로 영화제와 독립영화 시사회 현장을 오가며 일한다. 은하극장은 오래된 장비를 계속 보수해 쓰는 장소라서 더 많은 점검이 필요했다. 행사 며칠 전부터 그는 프로젝터 색상과 스피커 음량을 맞추느라 밤늦게까지 일했다.\n\n행사 준비 중 도경은 재민에게 “내가 로비에서 인사할 시간을 놓칠 수 있으니 안내 멘트만 미리 녹음하자”고 부탁했다. 11월 14일 19:48, 재민은 도경의 목소리를 2층 영사실에서 녹음했다. 도경은 “잠시 후 상영을 시작합니다. 편하게 자리에 앉아주세요”라고 말했다. 재민은 파일을 20:42에 자동으로 재생하도록 설정했다.\n\n재민은 이 작업에 정식 계약 범위 밖의 소프트웨어 플러그인을 사용했다. 이후 문제가 생기면 자신이 책임져야 한다는 것을 알고 있으므로 안내 방송을 미리 제작한 경위를 먼저 말하기가 꺼려진다. 그러나 녹음 사실 자체는 명백한 진실이다.","privateKnowledge":"20:42 방송이 생방송이 아니라 19:48에 녹음된 파일이라는 사실을 알고 있다. 그 사실을 숨길 의무는 없지만, 공개하면 승인되지 않은 플러그인을 쓴 일도 드러날 수 있다. 20:34·20:37·20:40에는 2층 영사실에서 손으로 장비 조작 버 ce":["C04","C09","C12","C18"],"evidence":"C04 · C09 · C12 · C18","actingTip":"설정집의 사실·비밀·진술 규칙을 구분해 연기합니다.","weakPoint":"미승인 오디오 플러그인 사용","revelation":"미승인 오디오 플러그인 사용","quotes":[],"hints":{},"props":[],"portrait":"assets/characters/role_b.png"},{"tag":"C","name":"한지우","age":30,"job":"행사 운영 PD","secret":"실제보다 180만 원 높은 행사비 초안을 도경에게 제출했다. 이 사실이 알려지면 행사 운영을 맡지 못하게 될 수 있다. 지하 창고에 있던 시간은 스스로 적은 장비 반출대장으로만 대체로 확인된다. 20:48에 사무실 문을 두드렸을 때 인기척이 없었지만 바쁘다고 생각했다. 20:51에 문서윤 관리자와 함께 다시 찾아가 안에 쓰러진 도경을 발견했다. 당신은 범인이 아니다.","public":"은하극장 시사회의 인력·동선·홍보물을 총괄하는 운영 PD. 제작대표의 서명을 받아야 하는 문서가 많아 관리사무실에도 자주 드나들었다. 건물의 지하 창고와 사무실 구조를 가장 잘 안다.","background":"은하극장 시사회의 인력·동선·홍보물을 총괄하는 운영 PD. 제작대표의 서명을 받아야 하는 문서가 많아 관리사무실에도 자주 드나들었다. 건물의 지하 창고와 사무실 구조를 가장 잘 안다.","private":"실제보다 180만 원 높은 행사비 초안을 도경에게 제출했다. 이 사실이 알려지면 행사 운영을 맡지 못하게 될 수 있다. 지하 창고에 있던 시간은 스스로 적은 장비 반출대장으로만 대체로 확인된다. 20:48에 사무실 문을 두드렸을 때 인기척이 없었지만 바쁘다고 생각했다. 20:51에 문서윤 관리자와 함께 다시 찾아가 안에 쓰러진 도경을 발견했다. 당신은 범인이 아니다.","alibi":"20:22~20:30 | 1층 매표소에서 운영인력 명단 점검 | 관리인과 동선 점검\n20:30~20:40 | 지하 설비창고에서 배너·무전기 배터리 수령 | 본인이 적은 반출대장\n20:40~20:44 | 1층 로비 및 상영관 앞에서 관리인과 대화 | 문서윤이 일부 확인 가능\n20:44~20:48 | 입장 동선과 객석 확인 | 혼자 있었던 구간 포함\n20:48~20:49 | 관리사무실 문을 두드렸으나 응답 없음 | 첫 번째 접근\n20:51~20:54 | 관리인과 사무실에 들어가 도경 발견 | 최초 발견자 중 한 명","items":["운영비 정산 초안과 수정 전 영수증","지하 창고 출입용 열쇠","무전기 배터리 반출대장","20:48 사무실에서 대답을 듣지 못했다는 기억"],"qa":[["행사비는 왜 다르게 기록됐나요?","급하게 처리한 운영비가 있어서 일부를 먼저 기재했습니다. 정식 승인은 아직 받지 못했습니다."],["20:35에 누가 지하에 함께 있었나요?","혼자 물품을 정리했습니다. 장비 반출대장이 있지만 제 필체로 적은 것이라 완벽한 알리바이는 아닙니다."],["20:48 문이 잠겨 있었나요?","잠겼는지는 확인하지 않았어요. 두드렸는데 대답이 없어서 바로 돌아섰습니다."],["누가 시신을 발견했나요?","20:51쯤 제가 문서윤 관리자와 함께 들어갔을 때 처음 발견했습니다."],["20:42 목소리는 어디서 들었나요?","상영관 방향 스피커에서 들었습니다. 피해자를 직접 본 것은 아닙니다."]],"objectives":["진범을 정확히 지목한다.","시신 발견 시각을 정확히 설명한다.","과장된 운영비의 처리 경위를 정리한다."],"id":3,"index":2,"roleKey":"C","roleMark":"ordinary","team":"비공개","oneLine":"은하극장 시사회의 인력·동선·홍보물을 총괄하는 운영 PD. 제작대표의 서명을 받아야 하는 문서가 많아 관리사무실에도 자주 드나들었다. 건물의 지하 창고와 사무실 구조를 가장 잘 안다.","declaration":"당신은 행사 운영 PD 한지우입니다.","prologue":"지우는 행사 준비를 위해 불과 세 주 전 은하극장 운영팀에 합류했다. 그는 제작대표 도경과 함께 공간 대관료, 현수막 발주, 운영인력 계약을 정리했다. 시사회 성사가 자신의 향후 기획 일거리와 연결돼 있었다.\n\n준비 기간 중 지우는 예상보다 비용이 늘어나자 일부 홍보·인력비를 실제보다 180만 원 높게 기재했다. 임시 운영비를 메우고 나중에 정산하면 된다고 생각했지만, 명백히 허락받지 않은 처리였다. 도경은 행사 당일 오전 해당 비용에 관해 질문했다.\n\n20:30 무렵 지우는 지하 창고에서 예비 배너와 무전기 배터리를 가져오느라 바빴다. 20:40쯤 1층으로 돌아와 상영관 앞에서 관리인과 다음 순서를 확인했다. 20:48에는 도경에게 진행표에 서명을 받으려 사무실에 다가갔지만 안에서 아무런 대답이 없었다.","motive":"지우는 행사 준비를 위해 불과 세 주 전 은하극장 운영팀에 합류했다. 그는 제작대표 도경과 함께 공간 대관료, 현수막 발주, 운영인력 계약을 정리했다. 시사회 성사가 자신의 향후 기획 일거리와 연결돼 있었다.\n\n준비 기간 중 지우는 예상보다 비용이 늘어나자 일부 홍보·인력비를 실제보다 180만 원 높게 기재했다. 임시 운영비를 메우고 나중에 정산하면 된다고 생각했지만, 명백히 허락받지 않은 처리였다. 도경은 행사 당일 오전 해당 비용에 관해 질문했다.\n\n20:30 무렵 지우는 지하 창고에서 예비 배너와 무전기 배터리를 가져오느라 바빴다. 20:40쯤 1층으로 돌아와 상영관 앞에서 관리인과 다음 순서를 확인했다. 20:48에는 도경에게 진행표에 서명을 받으려 사무실에 다가갔지만 안에서 아무런 대답이 없었다.","privateKnowledge":"실제보다 180만 원 높은 행사비 초안을 도경에게 제출했다. 이 사실이 알려지면 행사 운영을 맡지 못하게 될 수 있다. 지하 창고에 있던 시간은 스스로 적은 장비 반출대장으로만 대체로 확인된다. 20:48에 사무실 문을 두드렸을 때 인기척이 없었지만 바쁘다고 생각했다. 20:51에 문서윤 관리자와 함께 다시 찾아가 안에 쓰러진 도경을 발견했다. 당신은 범인이 아니다.","links":"은하극장 시사회의 인력·동선·홍보물을 총괄하는 운영 PD. 제작대표의 서명을 받아야 하는 문서가 많아 관리사무실에도 자주 드나들었다. 건물의 지하 창고와 사무실 구조를 가장 잘 안다.","purpose":"과장된 운영비의 처리 경위를 정리한다.","daySchedule":[{"time":"20:22~20:30","place":"1층 매표소","detail":"1층 매표소에서 운영인력 명단 점검","corroboration":"관리인과 동선 점검","visibility":"알려져도 됨"},{"time":"20:30~20:40","place":"지하 설비창고","detail":"지하 설비창고에서 배너·무전기 배터리 수령","corroboration":"본인이 적은 반출대장","visibility":"알려져도 됨"},{"time":"20:40~20:44","place":"1층 로비 및 상영관 앞","detail":"1층 로비 및 상영관 앞에서 관리인과 대화","corroboration":"문서윤이 일부 확인 가능","visibility":"알려져도 됨"},{"time":"20:44~20:48","place":"입장 동선과 객석 확인","detail":"입장 동선과 객석 확인","corroboration":"혼자 있었던 구간 포함","visibility":"알려져도 됨"},{"time":"20:48~20:49","place":"관리사무실 문을 두드렸으나 응답 없음","detail":"관리사무실 문을 두드렸으나 응답 없음","corroboration":"첫 번째 접근","visibility":"알려져도 됨"},{"time":"20:51~20:54","place":"관리인과 사무실에 들어가 도경 발견","detail":"관리인과 사무실에 들어가 도경 발견","corroboration":"최초 발견자 중 한 명","visi 일부 확인 가능\n20:32~20:44 | “로비에서 홍보자료 정리”라고 주장 | 거짓 진술\n20:34~20:39 | 실제로 관리사무실에서 도경과 대화 및 살해 | 범행 시간\n20:39~20:43 | 2층 기록보관실에 정산자료 은닉 | 재민이 20:43경 복도에서 목격\n20:43~20:46 | 2층 계단에서 1층 로비로 내려옴 | 서현이 20:46 로비에서 목격\n20:46~20:51 | 로비에서 상영 일정 문의 | 사건을 모르는 듯 행동","items":["권시우 명의 별도 사업자 거래내역 사본","홍보키트 2번 상자 인수증","정산 봉투와 같은 재질의 붉은 종이 부스러기가 묻은 서류 가방","제작대표와 20:34 만나기로 한 메시지"],"qa":[["도경과 20:34에 만나기로 했나요?","정산 이야기가 나온 건 맞지만, 그 시간에 실제로 사무실에 들어가지는 않았습니다. (거짓 진술)"],["그 시간에는 어디 있었나요?","로비에서 배급 관련 홍보물을 정리했습니다. 계속 혼자라 목격자는 없어요. (거짓 진술)"],["20:43에 왜 2층에서 목격됐나요?","홍보키트 내용물이 있는지 보러 잠깐 올라갔습니다. 누구나 갈 수 있는 곳입니다. (일부 사실)"],["홍보키트 안에 정산서가 왜 있나요?","누군가 제 물품에 넣었을 수 있습니다. 저는 그 자료를 보지 못했습니다. (거짓 진술)"],["다른 사업자 계좌로 돈을 받은 이유는?","정산을 빨리 하려고 임시로 사용했습니다. 횡령하려는 의도는 아니었습니다. (책임 회피 진술)"],["방송을 들었나요?","20:42에 도경 씨 목소리를 들었어요. 그때 살아 있었던 것으로 생각합니다. (녹음 여부는 모르면서 생존 근거로 사용)"]],"objectives":["범인으로 지목되지 않는다.","20:34 관리사무실 입실 및 2층 자료 은닉을 숨긴다.","배급 선급금 수령 사실을 가능한 한 축소한다."],"id":4,"index":3,"roleKey":"D","roleMark":"killer","team":"비공개","oneLine":"이번 영화의 배급·홍보계약을 담당한 실무 책임자. 제작대표 최도경과 가장 자주 돈과 일정 이야기를 나눴다. 행사 당일에도 배급사 담당자와 통화를 주고받느라 분주했다.","declaration":"당신은 배급·계약 총괄 권시우입니다.","prologue":"시우는 지난 세 달 동안 「잔상」의 배급 협상을 진행했다. 자금 사정이 나빠진 그는 제작사의 명의와 자신의 별도 사업자를 혼용해 선급금을 받을 수 있는 계약서를 만들었다. 배급사 측은 그가 제시한 서류를 진본으로 믿고 3,600만 원을 송금했다.\n\n시우는 우선 밀린 사업비를 메우고 며칠 후 제작사 계좌로 돌려놓을 생각이었다. 그러나 도경이 송금 내역을 확인하면서 계획이 무너졌다. 도경은 20:34에 관리사무실로 오라고 지시했다. “오늘 상영 전에 확실히 정리하자. 설명이 안 되면 바로 계약을 중지한다”고 했다.\n\n시우는 20:34 관리사무실에 들어갔다. 도경은 출력한 송금확인증과 붉은색 정산 봉투를 내밀며 서명이 위조됐다고 질책했다. 시우는 자료를 내놓으라고 요구했고 둘 사이에 몸싸움이 벌어졌다. 20:36 무렵 시우는 책상에 있던 무거운 황동 문진으로 도경의 머리를 가격했다. 도경이 쓰러진 뒤에는 구조 요청보다 자기에게 불리한 자료를 없애는 데 집중했다.\n\n20:39 시우는 정산 봉투와 출력물을 챙겨 2층 기록보관실로 올라갔다. 20:41 자신의 이름으로 반입된 홍보키트 2번 상자 안쪽에 자료를 숨겼다. 20:42 자동 안내 방송이 나오자 누군가는 도경이 아직 살아 있다고 생각할 것이라고 기대했다. 20:43 복도에서 영사기사 재민과 마주쳤으나 대수롭지 않게 넘어갔다. 20:46 로비로 돌아온 뒤 줄곧 1층에 있었던 것처럼 행동했다.","motive":"시우는 지난 세 달 동안 「잔상」의 배급 협상을 진행했다. 자금 사정이 나빠진 그는 제작사의 명의와 자신의 별도 사업자를 혼용해 선급금을 받을 수 있는 계약서를 만들었다. 배급사 측은 그가 제시한 서류를 진본으로 믿고 3,600만 원을 송금했다.\n\n시우는 우선 밀린 사업비를 메우고 며칠 후 제작사 계좌로 돌려놓을 생각이었다. 그러나 도경이 송금 내역을 확인하면서 계획이 무너졌다. 도경은 20:34에 관리사무실로 오라고 지시했다. “오늘 상영 전에 확실히 정리하자. 설명이 안 되면 바로 계약을 중지한다”고 했다.\n\n시우는 20:34 관리사무실에 들어갔다. 도경은 출력한 송금확인증과 붉은색 정산 봉투를 내밀며 서명이 위조됐다고 질책했다. 시우는 자료를 내놓으라고 요구했고 둘 사이에 몸싸움이 벌어졌다. 20:36 무렵 시우는 책상에 있던 무거운 황동 문진으로 도경의 머리를 가격했다. 도경이 쓰러진 뒤에는 구조 요청보다 자기에게 불리한 자료를 없애는 데 집중했다.\n\n20:39 시우는 정산 봉투와 출력물을 챙겨 2층 기록보관실로 올라갔다. 20:41 자신의 이름으로 반입된 홍보키트 2번 상자 안쪽에 자료를 숨겼다. 20:42 자동 안내 방송이 나오자 누군가는 도경이 아직 살아 있다고 생각할 것이라고 기대했다. 20:43 복도에서 영사기사 재민과 마주쳤으나 대수롭지 않게 넘어갔다. 20:46 로비로 돌아온 뒤 줄곧 1층에 있었던 것처럼 행동했다.","privateKnowledge":"당신이 최도경을 숨지게 한 유일한 범인이다. 공범은 없다. 살인은 미리 계획하지 않았다. 하지만 사건 직후 붉은 정산 봉투를 찢고, 안에 있던 지급 확인자료를 2층 홍보키트 2번 상자에 숨겼으며, 현장에 놓인 황동 문진을 물티슈로 닦은 것은 의도적인 증거 은폐다. 당신은 20:42 안내 방송이 녹음이었다는 사실을 확정적으로 알지는 못했지만, 당시 도경이 살아 있는 것처럼 상황을 설명하려 한다. 20:34~20:44에 로비에서 홍보물을 정리했다고 거짓말할 수 있다.","links":"이번 영화의 배급·홍보계약을 담당한 실무 책임자. 제작대표 최도경과 가장 자주 돈과 일정 이야기를 나눴다. 행사 당일에도 배급사 담당자와 통화를 주고받느라 분주했다.","purpose":"배급 선급금 수령 사실을 가능한 한 축소한다.","daySchedule":[{"time":"20:22~20:32","place":"1층 대기 구역","detail":"1층 대기 구역에서 배급사 연락","corroboration":"실제 일부 확인 가능","visibility":"알려져도 됨"},{"time":"20:32~20:44","place":"“로비","detail":"“로비에서 홍보자료 정리”라고 주장","corroboration":"거짓 진술","visibility":"비공개"},{"time":"20:34~20:39","place":"실제로 관리사무실","detail":"실제로 관리사무실에서 도경과 대화 및 살해","corroboration":"범행 시간","visibility":"비공개"},{"time":"20:39~20:43","place":"2층 기록보관실에 정산자료 은닉","detail":"2층 기록보관실에 정산자료 은닉","corroboration":"재민이 20:43경 복도에서 목격","visibility":"알려져도 됨"},{"time":"20:43~20:46","place":"2층 계단","detail":"2층 계단에서 1층 로비로 내려옴","corroboration":"서현이 20:46 로비에서 목격","visibility":"알려져도 됨"},{"time":"20:46~20:51","place":"로비","detail":"로비에서 상영 일정 문의","corroboration":"사건을 모르는 듯 행동","visibility":"알려져도 됨"}],"personalItems":[["권시우 명의 별도 사업자 거래내역 사본","권시우 명의 별도 사업자 거래내역 사본"],["홍보키트 2번 상자 인수증","홍보키트 2번 상자 인수증"],["정산 봉투와 같은 재질의 붉은 종이 부스러기가 묻은 서류 가방","정산 봉투와 같은 재질의 붉은 종이 부스러기가 묻은 서류 가방"],["제작대표와 20:34 만나기로 한 메시지","제작대표와 20:34 만나기로 한 메시지"]],"goals":["
